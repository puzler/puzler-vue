fragment CollectionPublicFields on Collection {
  id
  title
  kind
  description
  pageDescriptionHtml
  coverImageUrl
  accentColor
  bgTreatment
  titleFont
  mode
  timed
  author {
    id
    username
    displayName
  }
  puzzles {
    id
    title
    shareToken
    constraintTypes
    avgRating
    solveCount
    sudokupadUrl
  }
  hasCodewords
  nextReleaseAt
  competitionConfig {
    timeLimitSeconds
    submissionPolicy
    penaltyPoints
    bonusPointsPerMinute
    clampScoreAtZero
    enforcedSettings
    locked
  }
  myCompetitionRun {
    id
    startedAt
    deadline
    finishedAt
    finalized
    secondsRemaining
    basePoints
    penaltyPoints
    bonusPoints
    totalPoints
    correctCount
    timeUsedSeconds
    submissions {
      puzzleId
      submittedAt
      correct
      wrongAttempts
    }
  }
  entries {
    id
    entryType
    position
    locked
    solved
    gated
    hidden
    finale
    points
    storyTitle
    puzzle {
      id
    }
    storyPage {
      id
      title
      bodyHtml
    }
  }
}
