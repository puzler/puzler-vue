fragment CollectionPublicFields on Collection {
  id
  title
  description
  pageDescriptionHtml
  coverImageUrl
  accentColor
  bgTreatment
  titleFont
  mode
  timed
  author {
    id
    username
    displayName
  }
  puzzles {
    id
    title
    shareToken
    constraintTypes
    avgRating
    solveCount
  }
}
