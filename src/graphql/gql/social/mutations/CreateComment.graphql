#import "../../fragments/CommentFields.graphql"

mutation CreateComment($puzzleId: ID!, $body: String!, $parentId: ID, $spoiler: Boolean) {
  createComment(input: { puzzleId: $puzzleId, body: $body, parentId: $parentId, spoiler: $spoiler }) {
    comment {
      ...CommentFields
    }
    errors
  }
}
