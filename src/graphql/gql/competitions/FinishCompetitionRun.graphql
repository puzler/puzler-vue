mutation FinishCompetitionRun($collectionId: ID!) {
  finishCompetitionRun(input: { collectionId: $collectionId }) {
    run {
      id
      finalized
      basePoints
      penaltyPoints
      bonusPoints
      totalPoints
      correctCount
      timeUsedSeconds
      submissions {
        puzzleId
        correct
        wrongAttempts
        submittedAt
      }
    }
    errors
  }
}
