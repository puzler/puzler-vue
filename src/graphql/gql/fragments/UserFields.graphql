#import "./UserThemeFields.graphql"

fragment UserFields on User {
  id
  email
  username
  displayName
  avatarUrl
  bio
  role
  passwordSet
  profileVisibility {
    solveHistory
    stats
    favorites
    subscriptions
    activity
  }
  puzzlePreferences {
    includeSolutionInSudokupadExport
    commentsRequireSolveDefault
  }
  playerSettings
  colorPalette
  activeThemeId
  enableCustomStyles
  userThemes {
    ...UserThemeFields
  }
  oauthConnections {
    provider
    createdAt
  }
  hidePatronTeasers
  patreon {
    capabilities {
      memberships
      creator
    }
    campaign {
      id
      title
      url
      currency
      status
      teasersEnabled
      campaignSyncedAt
      tiers {
        id
        patreonId
        title
        amountCents
        published
        discarded
      }
    }
    memberships {
      id
      patronStatus
      entitledAmountCents
      syncedAt
      campaign {
        title
        url
        currency
        creatorUsername
      }
    }
  }
}
