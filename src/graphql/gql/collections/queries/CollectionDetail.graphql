query CollectionDetail($id: ID!) {
  collection(id: $id) {
    id
    title
    description
    pageDescriptionHtml
    coverImageUrl
    accentColor
    bgTreatment
    titleFont
    visibility
    mode
    timed
    shareToken
    entries {
      id
      entryType
      position
      gated
      hidden
      finale
      puzzle {
        id
        title
        status
        visibility
      }
      storyPage {
        id
        title
        bodyHtml
      }
    }
  }
}
