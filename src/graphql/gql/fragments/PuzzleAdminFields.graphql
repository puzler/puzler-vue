fragment PuzzleAdminFields on Puzzle {
  id
  status
  visibility
  shareToken
  pageDescriptionHtml
  commentsRequireSolveOverride
  publishedVersion {
    id
  }
  grantedUsers {
    id
    username
    displayName
  }
  releasedAt
  patronGate {
    mode
    minTier {
      id
    }
    tiers {
      id
    }
    minAmountCents
    patronsSinceRelease
  }
}
