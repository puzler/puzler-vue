query CollectionDetail($id: ID!) {
  collection(id: $id) {
    id
    title
    kind
    description
    pageDescriptionHtml
    coverImageUrl
    accentColor
    bgTreatment
    titleFont
    visibility
    mode
    timed
    shareToken
    releasedAt
    patronGate {
      mode
      minTier {
        id
      }
      tiers {
        id
      }
      minAmountCents
      patronsSinceRelease
    }
    competitionConfig {
      timeLimitSeconds
      submissionPolicy
      penaltyPoints
      bonusPointsPerMinute
      clampScoreAtZero
      showEntryPoints
      enforcedSettings
      locked
    }
    entries {
      id
      entryType
      position
      gated
      hidden
      finale
      releasedAt
      points
      puzzle {
        id
        title
        status
        visibility
        constraintTypes
      }
      storyPage {
        id
        title
        bodyHtml
      }
    }
  }
}
